name: Feature request
description: Something the package should do in a Flutter app.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation on your site, not the solution yet.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like the package to do?
  - type: textarea
    id: workaround
    attributes:
      label: How do you handle it today?
